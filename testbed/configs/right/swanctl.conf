# Hand-written reference configuration for the first working tunnel (Step 1.3).
# IKEv2, AES-GCM-256, DH group 20 (ecp384), PFS on, tunnel mode, PSK auth.
#
# There is deliberately NO secret in this file. The pre-shared key is generated per
# run and written to conf.d/psk.conf by the container entrypoint, so no credential
# is ever committed to the repository.

connections {
    net-net {
        local_addrs  = 10.100.0.3
        remote_addrs = 10.100.0.2
        version = 2
        proposals = aes256gcm16-prfsha384-ecp384

        local {
            auth = psk
            id = right
        }
        remote {
            auth = psk
            id = left
        }

        children {
            net-net {
                local_ts  = 10.2.0.0/24
                remote_ts = 10.1.0.0/24
                # PFS: a DH group in the ESP proposal forces a fresh exchange on rekey.
                esp_proposals = aes256gcm16-ecp384
                mode = tunnel
                start_action = none
            }
        }
    }
}

include conf.d/*.conf
