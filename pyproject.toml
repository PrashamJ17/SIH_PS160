[project]
name = "ipsec-sentinel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "scapy>=2.5.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "xgboost>=2.0", "shap>=0.44", "joblib>=1.3"]
api = ["fastapi>=0.109", "uvicorn>=0.27"]
report = ["jinja2>=3.1", "weasyprint>=60.0"]
dev = [
    "pytest>=7.4", "pytest-cov>=4.1", "pytest-xdist>=3.5",
    "hypothesis>=6.92", "mypy>=1.8", "ruff>=0.1.14",
    "types-PyYAML", "pandas-stubs",
]

[project.scripts]
sentinel = "ipsec_sentinel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires Docker/root (deselect with '-m \"not integration\"')",
    "slow: takes more than 5 seconds",
]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "testbed", "scripts"]

# slixmpp runs inside the traffic container, not on the host, so it is deliberately
# absent from the host venv. Only its stubs are waived — the script's own code is
# still fully type-checked.
[[tool.mypy.overrides]]
module = "slixmpp.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]
